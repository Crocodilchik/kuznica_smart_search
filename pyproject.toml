[project]
name = "kuznica-smart-search"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "confluent-kafka>=2.11,<3",
    "fastapi>=0.115,<1",
    "langgraph>=1.0,<2",
    "pydantic>=2.11,<3",
    "streamlit>=1.45,<2",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8,<10", "ruff>=0.11,<1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
