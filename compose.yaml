x-image: &app-image
  image: kuznica-smart-search:local
  build:
    context: .

services:
  api:
    <<: *app-image
    init: true
    env_file:
      - path: .env
        required: false
    environment:
      SMART_SEARCH_MODE: prod
      SMART_SEARCH_BACKEND_MODULE: smart_search.backend
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      SOFTLINE_CATALOG_DIR: /var/lib/smart-search/catalog
      SOFTLINE_INDEX_DIR: /var/lib/smart-search/qdrant
      SMART_SEARCH_EVENT_DB: /var/lib/smart-search/events.sqlite3
    ports:
      - "127.0.0.1:${SMART_SEARCH_API_PORT:-8000}:8000"
    volumes:
      - search-data:/var/lib/smart-search
    command:
      - python
      - -m
      - uvicorn
      - smart_search.interfaces.api:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health/ready', timeout=3).close()
      interval: 20s
      timeout: 5s
      start_period: 30s
      retries: 3

  frontend:
    image: kuznica-smart-search-frontend:local
    build:
      context: .
      dockerfile: frontend/Dockerfile
    init: true
    environment:
      NODE_ENV: production
      SMART_SEARCH_API_URL: http://api:8000
      PORT: 3000
      HOSTNAME: 0.0.0.0
    depends_on:
      api:
        condition: service_started
    ports:
      - "127.0.0.1:${SMART_SEARCH_FRONTEND_PORT:-3000}:3000"

  catalog:
    <<: *app-image
    profiles: [setup]
    working_dir: /var/lib/smart-search
    environment:
      PYTHONPATH: /app
    healthcheck:
      disable: true
    volumes:
      - search-data:/var/lib/smart-search
      - type: bind
        source: ${SOFTLINE_FEED_PATH:-./data/raw/Mindbox.yml.gz.xml}
        target: /input/Mindbox.yml.gz.xml
        read_only: true
        bind:
          create_host_path: false
    command:
      - /bin/sh
      - -ec
      - |
        python -X utf8 -m softline_search prepare /input/Mindbox.yml.gz.xml --output /var/lib/smart-search/catalog --reports /var/lib/smart-search/catalog-reports
        python -X utf8 -m softline_search index --catalog /var/lib/smart-search/catalog --output /var/lib/smart-search/qdrant

volumes:
  search-data:
